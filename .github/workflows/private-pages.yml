name: Deploy private ledger
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: private-ledger-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser-safe connection settings
        run: |
          node -e 'const fs=require("fs"),vm=require("vm"),ctx={window:{}};vm.runInNewContext(fs.readFileSync("config.js","utf8"),ctx);const c=ctx.window.LEDGER_CONFIG;if(!c.supabaseUrl.startsWith("https://")||!c.publishableKey.startsWith("sb_publishable_"))throw Error("Configure Project URL and publishable key first");'
      - run: npm ci
      - run: npm run check
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run package:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
